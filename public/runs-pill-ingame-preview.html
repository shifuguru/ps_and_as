<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Runs! pill — in-game size</title>
  <style>
    * { box-sizing: border-box; margin: 0; }
    html, body {
      height: 100%;
      background:
        radial-gradient(ellipse 70% 60% at 50% 45%, #1a3d2e 0%, #0a1812 55%, #050a08 100%);
      font-family: "Segoe UI", "Helvetica Neue", sans-serif;
      overflow: hidden;
    }
    .label {
      position: absolute;
      top: 18px;
      left: 20px;
      font-size: 12px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #7d907f;
      z-index: 3;
    }
    .stage {
      height: 100%;
      display: grid;
      place-items: center;
    }
    /* Matches GameTable play-type badge scale */
    .host {
      position: relative;
      width: 72px;
      height: 28px;
    }
    canvas {
      position: absolute;
      pointer-events: none;
    }
    .pill {
      position: relative;
      z-index: 2;
      width: 100%;
      height: 100%;
      border-radius: 999px;
      display: grid;
      place-items: center;
      background: rgba(255, 250, 240, 0.96);
      color: #111;
      font-weight: 800;
      font-size: 11px;
      letter-spacing: 0.4px;
      border: 1.5px solid rgba(255, 180, 55, 0.92);
      box-shadow:
        0 0 0 1px rgba(255, 130, 25, 0.35),
        0 0 14px rgba(255, 140, 30, 0.45);
    }
  </style>
</head>
<body>
  <div class="label">In-game Runs! pill · conveyor fire</div>
  <div class="stage">
    <div class="host" id="host">
      <canvas id="fire"></canvas>
      <div class="pill">Runs!</div>
    </div>
  </div>
  <script>
    // Same conveyor model as realisticFireSim / RealisticFireCanvas.web
    const host = document.getElementById("host");
    const canvas = document.getElementById("fire");
    const ctx = canvas.getContext("2d", { alpha: true });
    const DPR = Math.min(devicePixelRatio || 1, 2);

    const BURN = {
      riseTop: -78, riseSide: -44, riseBottom: -24, riseEmber: -60,
      lifeTop: 0.62, lifeSide: 0.48, lifeBottom: 0.4, lifeEmber: 0.85,
      swayFreq: 2.8, emberSwayFreq: 2.0,
    };

    let W = 72, H = 28;
    const padX = Math.max(22, W * 0.45);
    const padTop = Math.max(36, H * 2.1);
    const padBottom = Math.max(14, H * 0.55);
    const cw = Math.ceil(W + padX * 2);
    const ch = Math.ceil(H + padTop + padBottom);
    canvas.width = Math.floor(cw * DPR);
    canvas.height = Math.floor(ch * DPR);
    canvas.style.width = cw + "px";
    canvas.style.height = ch + "px";
    canvas.style.left = -padX + "px";
    canvas.style.top = -padTop + "px";
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

    const pill = { x: padX + W / 2, y: padTop + H / 2, w: W, h: H };
    const scale = Math.max(0.42, Math.min(0.75, W / 140));
    const COLUMNS = Math.max(8, Math.min(14, Math.round(W / 7)));
    const PER = 7;

    function topSpan() {
      const hw = pill.w / 2, hh = pill.h / 2;
      return { left: pill.x - hw + hh * 0.15, right: pill.x + hw - hh * 0.15, y: pill.y - hh };
    }
    function columnX(c) {
      const s = topSpan();
      return s.left + (s.right - s.left) * (c / (COLUMNS - 1));
    }

    const particles = [];
    const embers = [];
    const span = topSpan();
    const lane = (span.right - span.left) / COLUMNS;
    for (let c = 0; c < COLUMNS; c++) {
      for (let s = 0; s < PER; s++) {
        const jitter = (Math.random() - 0.5) * lane * 0.22;
        const anchorX = columnX(c) + jitter;
        const rise = BURN.riseTop * scale;
        const life = BURN.lifeTop;
        const age = (s / PER) * life;
        particles.push({
          anchorX, originY: span.y, x: anchorX, y: span.y + rise * age,
          rise, life, age,
          size: (8.5 + Math.random() * 3.5) * scale,
          heat: 0.84 + Math.random() * 0.14,
          seed: Math.random() * Math.PI * 2,
          stretch: 1.85 + Math.random() * 0.3,
          front: s % 3 === 0,
        });
      }
    }
    for (let i = 0; i < COLUMNS; i++) {
      const anchorX = columnX(i);
      const rise = BURN.riseEmber * scale;
      const life = BURN.lifeEmber;
      const age = (i / COLUMNS) * life;
      embers.push({
        anchorX, originY: span.y, x: anchorX, y: span.y + rise * age,
        rise, life, age, size: (1.2 + (i % 3) * 0.35) * scale,
        phase: (i / COLUMNS) * Math.PI * 2,
      });
    }

    function blob(x, y, rx, ry, stops) {
      const g = ctx.createRadialGradient(x, y, 0, x, y, Math.max(rx, ry));
      for (const [o, c] of stops) g.addColorStop(o, c);
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2);
      ctx.fill();
    }

    function drawP(p) {
      const t = p.age / p.life;
      const grow = t < 0.08 ? t / 0.08 : 1;
      const fade = t > 0.82 ? 1 - (t - 0.82) / 0.18 : 1;
      const a = grow * fade * (0.32 + p.heat * 0.38);
      if (a < 0.02) return;
      const rx = p.size * 0.42, ry = p.size * p.stretch;
      ctx.save();
      ctx.globalCompositeOperation = "lighter";
      ctx.globalAlpha = a;
      blob(p.x, p.y, rx, ry, [
        [0, `rgba(255,${Math.floor(210 * p.heat)},55,1)`],
        [0.3, `rgba(255,${Math.floor(120 + 35 * p.heat)},16,0.8)`],
        [0.65, "rgba(255,60,5,0.32)"],
        [1, "rgba(40,0,0,0)"],
      ]);
      if (t < 0.35) {
        ctx.globalAlpha = a * 0.8 * (1 - t / 0.35);
        blob(p.x, p.y + ry * 0.15, rx * 0.45, ry * 0.4, [
          [0, "rgba(255,255,240,1)"],
          [0.45, "rgba(255,230,120,0.85)"],
          [1, "rgba(255,140,20,0)"],
        ]);
      }
      ctx.restore();
    }

    let last = performance.now(), sim = 0;
    function frame(now) {
      let fd = Math.min(0.05, (now - last) / 1000);
      last = now;
      const step = 1 / 60;
      while (fd > 0) {
        const dt = Math.min(step, fd);
        sim += dt;
        for (const p of particles) {
          p.age += dt; if (p.age >= p.life) p.age -= p.life;
          p.y = p.originY + p.rise * p.age;
          p.x = p.anchorX + Math.sin(sim * BURN.swayFreq + p.seed) * 4.5 * scale;
        }
        for (const e of embers) {
          e.age += dt; if (e.age >= e.life) e.age -= e.life;
          e.y = e.originY + e.rise * e.age;
          e.x = e.anchorX + Math.sin(sim * BURN.emberSwayFreq + e.phase) * 6 * scale;
        }
        fd -= dt;
      }
      ctx.clearRect(0, 0, cw, ch);
      for (const p of particles) if (!p.front) drawP(p);
      for (const e of embers) {
        const t = e.age / e.life;
        const a = Math.sin(t * Math.PI) * (0.75 + 0.25 * Math.sin(e.phase + t * Math.PI * 2));
        if (a < 0.02) continue;
        ctx.save();
        ctx.globalCompositeOperation = "lighter";
        ctx.globalAlpha = a;
        blob(e.x, e.y, e.size * 2.2, e.size * 2.2, [
          [0, "rgba(255,245,180,1)"],
          [0.4, "rgba(255,165,45,0.75)"],
          [1, "rgba(255,60,0,0)"],
        ]);
        ctx.restore();
      }
      ctx.save();
      ctx.beginPath();
      ctx.rect(0, 0, cw, ch);
      const ix = pill.w / 2 - 3, iy = pill.h / 2 - 2;
      const x = pill.x - ix, y = pill.y - iy, w = ix * 2, h = iy * 2, r = iy;
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
      ctx.clip("evenodd");
      for (const p of particles) if (p.front) drawP(p);
      ctx.restore();
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  </script>
</body>
</html>
