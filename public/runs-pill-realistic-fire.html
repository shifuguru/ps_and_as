<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Runs! pill — realistic fire</title>
  <style>
    :root {
      --bg0: #040606;
      --pill: #f3eee3;
      --ink: #1a120c;
    }
    * { box-sizing: border-box; margin: 0; }
    html, body {
      height: 100%;
      background:
        radial-gradient(ellipse 50% 40% at 50% 54%, rgba(255, 110, 20, 0.14), transparent 60%),
        radial-gradient(ellipse 90% 80% at 50% 50%, #0c1411 0%, var(--bg0) 72%);
      color: #cfc8bc;
      font-family: "Segoe UI", "Helvetica Neue", sans-serif;
      overflow: hidden;
    }
    .stage {
      position: relative;
      width: 100%;
      height: 100%;
      display: grid;
      place-items: center;
    }
    canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }
    .pill {
      position: relative;
      z-index: 2;
      padding: 15px 40px;
      border-radius: 999px;
      background: linear-gradient(180deg, #fffaf1 0%, var(--pill) 52%, #e7dece 100%);
      color: var(--ink);
      font-weight: 800;
      font-size: 30px;
      letter-spacing: 0.03em;
      line-height: 1;
      border: 1.5px solid rgba(255, 190, 70, 0.9);
      box-shadow:
        0 0 0 1px rgba(255, 130, 25, 0.4),
        0 0 20px rgba(255, 150, 40, 0.65),
        0 0 48px rgba(255, 90, 10, 0.32),
        inset 0 1px 0 rgba(255, 255, 255, 0.7);
      user-select: none;
      pointer-events: none;
    }
    .label {
      position: absolute;
      top: 18px;
      left: 20px;
      font-size: 12px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #6f8572;
      z-index: 3;
    }
  </style>
</head>
<body>
  <div class="label">Realistic fire · canvas particles + additive bloom</div>
  <div class="stage">
    <canvas id="fire"></canvas>
    <div class="pill" id="pill">Runs!</div>
  </div>
  <script>
    const canvas = document.getElementById("fire");
    const pillEl = document.getElementById("pill");
    const ctx = canvas.getContext("2d", { alpha: true });
    const DPR = Math.min(window.devicePixelRatio || 1, 2);

    let W = 0, H = 0;
    let pill = { x: 0, y: 0, w: 0, h: 0 };

    const HASH = new Float32Array(256);
    for (let i = 0; i < 256; i++) HASH[i] = Math.random() * 2 - 1;
    function noise1(x) {
      const i = Math.floor(x) & 255;
      const f = x - Math.floor(x);
      const u = f * f * (3 - 2 * f);
      return HASH[i] * (1 - u) + HASH[(i + 1) & 255] * u;
    }
    function noise2(x, y) {
      return noise1(x + noise1(y * 1.71) * 19.3);
    }

    function resize() {
      W = window.innerWidth;
      H = window.innerHeight;
      canvas.width = Math.floor(W * DPR);
      canvas.height = Math.floor(H * DPR);
      ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
      syncPill();
    }

    function syncPill() {
      const r = pillEl.getBoundingClientRect();
      pill = {
        x: r.left + r.width / 2,
        y: r.top + r.height / 2,
        w: r.width,
        h: r.height,
      };
    }

    function rimSample() {
      const hw = pill.w / 2;
      const hh = pill.h / 2;
      const flat = Math.max(0, hw - hh);
      const roll = Math.random();
      if (roll < 0.62) {
        return {
          x: pill.x - flat + Math.random() * flat * 2,
          y: pill.y - hh + (Math.random() - 0.35) * 5,
          zone: "top",
        };
      }
      if (roll < 0.75) {
        const a = Math.PI * 0.55 + Math.random() * Math.PI * 0.9;
        return {
          x: pill.x - flat + Math.cos(a) * hh,
          y: pill.y + Math.sin(a) * hh,
          zone: "left",
        };
      }
      if (roll < 0.88) {
        const a = -Math.PI * 0.45 + Math.random() * Math.PI * 0.9;
        return {
          x: pill.x + flat + Math.cos(a) * hh,
          y: pill.y + Math.sin(a) * hh,
          zone: "right",
        };
      }
      return {
        x: pill.x - flat + Math.random() * flat * 2,
        y: pill.y + hh + (Math.random() - 0.55) * 4,
        zone: "bottom",
      };
    }

    const MAX_P = 420;
    const MAX_E = 70;
    const particles = [];
    const embers = [];

    function makeParticle(front) {
      const s = rimSample();
      const top = s.zone === "top";
      const bottom = s.zone === "bottom";
      const tongue = top && Math.random() < 0.48;
      return {
        x: s.x + (Math.random() - 0.5) * 5,
        y: s.y + (Math.random() - 0.5) * 3,
        vx: (Math.random() - 0.5) * (top ? 28 : 12),
        vy: top
          ? -(70 + Math.random() * (tongue ? 140 : 100))
          : bottom
            ? -(10 + Math.random() * 22)
            : -(28 + Math.random() * 55),
        life: top
          ? 0.45 + Math.random() * (tongue ? 1.05 : 0.75)
          : 0.3 + Math.random() * 0.45,
        age: Math.random() * 0.15,
        size: top
          ? tongue
            ? 12 + Math.random() * 20
            : 24 + Math.random() * 44
          : bottom
            ? 12 + Math.random() * 18
            : 14 + Math.random() * 26,
        heat: top ? 0.82 + Math.random() * 0.18 : 0.5 + Math.random() * 0.4,
        seed: Math.random() * 1000,
        front: !!front,
        stretch: tongue ? 2.0 + Math.random() * 1.6 : 1.15 + Math.random() * 0.75,
      };
    }

    function makeEmber() {
      const s = rimSample();
      return {
        x: s.x,
        y: s.y,
        vx: (Math.random() - 0.5) * 40,
        vy: -(70 + Math.random() * 130),
        life: 0.7 + Math.random() * 1.3,
        age: 0,
        size: 1.1 + Math.random() * 2.8,
        phase: Math.random() * Math.PI * 2,
      };
    }

    function drawSoftBlob(x, y, rx, ry, stops) {
      const g = ctx.createRadialGradient(x, y, 0, x, y, Math.max(rx, ry));
      for (const [o, c] of stops) g.addColorStop(o, c);
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2);
      ctx.fill();
    }

    function drawParticle(p) {
      const t = Math.min(1, p.age / p.life);
      if (t >= 1) return;
      const fade = 1 - t;
      const heat = p.heat;
      const a = fade * fade * (0.24 + heat * 0.4);
      if (a < 0.01) return;

      const base = p.size * (0.7 + fade * 0.55);
      const rx = base * (0.5 + (1 - heat) * 0.15);
      const ry = base * p.stretch * (0.95 + t * 0.75);

      ctx.save();
      ctx.globalCompositeOperation = "lighter";
      ctx.globalAlpha = a;

      drawSoftBlob(p.x, p.y, rx, ry, [
        [0, `rgba(255,${Math.floor(205 * heat)},45,1)`],
        [0.32, `rgba(255,${Math.floor(105 + 45 * heat)},10,0.78)`],
        [0.65, `rgba(255,48,0,0.3)`],
        [1, "rgba(40,0,0,0)"],
      ]);

      if (t < 0.42) {
        const k = 1 - t / 0.42;
        ctx.globalAlpha = a * 0.95 * k;
        drawSoftBlob(p.x, p.y + ry * 0.14, rx * 0.4, ry * 0.36, [
          [0, "rgba(255,255,240,1)"],
          [0.4, `rgba(255,235,${Math.floor(130 * heat)},0.9)`],
          [1, "rgba(255,140,20,0)"],
        ]);
      }
      ctx.restore();
    }

    function drawEmber(e) {
      const t = e.age / e.life;
      if (t >= 1) return;
      const tw = 0.5 + 0.5 * Math.sin(e.phase + e.age * 16);
      const a = (1 - t) * tw;
      ctx.save();
      ctx.globalCompositeOperation = "lighter";
      ctx.globalAlpha = a;
      const s = e.size * (1.1 - t * 0.35);
      drawSoftBlob(e.x, e.y, s * 2.8, s * 2.8, [
        [0, "rgba(255,245,180,1)"],
        [0.35, "rgba(255,170,50,0.8)"],
        [1, "rgba(255,60,0,0)"],
      ]);
      ctx.restore();
    }

    function drawBloom(time) {
      const pulse = 0.92 + 0.08 * Math.sin(time * 3.4);
      ctx.save();
      ctx.globalCompositeOperation = "lighter";
      drawSoftBlob(
        pill.x,
        pill.y - pill.h * 0.55,
        pill.w * 0.98 * pulse,
        pill.h * 2.6 * pulse,
        [
          [0, "rgba(255,195,75,0.3)"],
          [0.35, "rgba(255,110,20,0.17)"],
          [0.7, "rgba(255,50,0,0.07)"],
          [1, "rgba(0,0,0,0)"],
        ]
      );
      drawSoftBlob(pill.x, pill.y, pill.w * 0.64, pill.h * 1.0, [
        [0, "rgba(255,205,95,0.22)"],
        [0.55, "rgba(255,120,30,0.09)"],
        [1, "rgba(0,0,0,0)"],
      ]);
      ctx.restore();
    }

    function update(dt, time) {
      while (particles.length < MAX_P) {
        particles.push(makeParticle(Math.random() < 0.32));
      }
      if (embers.length < MAX_E && Math.random() < 0.65) {
        embers.push(makeEmber());
      }

      for (let i = 0; i < particles.length; i++) {
        const p = particles[i];
        p.age += dt;
        if (p.age >= p.life) {
          particles[i] = makeParticle(p.front);
          continue;
        }
        const t = p.age / p.life;
        const turb = noise2(p.seed + time * 2.4, p.y * 0.022) * (42 + t * 75);
        const flutter = noise2(p.y * 0.04 + p.seed, time * 3.1) * 24;
        p.vx += (turb + flutter) * dt;
        p.vx += Math.sin(time * 5.2 + p.seed * 1.7) * 16 * dt;
        p.vy += (-18 - (1 - t) * 28) * dt;
        p.vx += t * t * noise2(time * 1.3, p.seed) * 40 * dt;
        p.vx *= 1 - 0.5 * dt;
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.x += (p.x - pill.x) * 0.1 * dt;
      }

      for (let i = embers.length - 1; i >= 0; i--) {
        const e = embers[i];
        e.age += dt;
        if (e.age >= e.life) {
          embers.splice(i, 1);
          continue;
        }
        e.vx += noise2(e.x * 0.04, time * 2.2) * 52 * dt;
        e.vy -= 24 * dt;
        e.vx *= 1 - 0.32 * dt;
        e.x += e.vx * dt;
        e.y += e.vy * dt;
      }
    }

    function roundRectPath(c, x, y, w, h, r) {
      c.moveTo(x + r, y);
      c.arcTo(x + w, y, x + w, y + h, r);
      c.arcTo(x + w, y + h, x, y + h, r);
      c.arcTo(x, y + h, x, y, r);
      c.arcTo(x, y, x + w, y, r);
      c.closePath();
    }

    let last = performance.now();
    function frame(now) {
      const dt = Math.min(0.033, (now - last) / 1000);
      last = now;
      const time = now / 1000;

      syncPill();
      update(dt, time);

      ctx.clearRect(0, 0, W, H);
      drawBloom(time);

      for (const p of particles) {
        if (!p.front) drawParticle(p);
      }
      for (const e of embers) drawEmber(e);

      ctx.save();
      ctx.beginPath();
      ctx.rect(0, 0, W, H);
      const insetX = pill.w / 2 - 8;
      const insetY = pill.h / 2 - 5;
      roundRectPath(
        ctx,
        pill.x - insetX,
        pill.y - insetY,
        insetX * 2,
        insetY * 2,
        insetY
      );
      ctx.clip("evenodd");
      for (const p of particles) {
        if (p.front) drawParticle(p);
      }
      ctx.restore();

      requestAnimationFrame(frame);
    }

    window.addEventListener("resize", resize);
    resize();
    for (let i = 0; i < MAX_P; i++) particles.push(makeParticle(Math.random() < 0.32));
    for (let i = 0; i < 28; i++) embers.push(makeEmber());
    requestAnimationFrame(frame);
  </script>
</body>
</html>
