<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Runs! pill — realistic fire</title>
  <style>
    :root {
      --bg0: #040606;
      --pill: #f3eee3;
      --ink: #1a120c;
    }
    * { box-sizing: border-box; margin: 0; }
    html, body {
      height: 100%;
      background:
        radial-gradient(ellipse 50% 40% at 50% 54%, rgba(255, 110, 20, 0.1), transparent 60%),
        radial-gradient(ellipse 90% 80% at 50% 50%, #0c1411 0%, var(--bg0) 72%);
      color: #cfc8bc;
      font-family: "Segoe UI", "Helvetica Neue", sans-serif;
      overflow: hidden;
    }
    .stage {
      position: relative;
      width: 100%;
      height: 100%;
      display: grid;
      place-items: center;
    }
    canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }
    .pill {
      position: relative;
      z-index: 2;
      padding: 15px 40px;
      border-radius: 999px;
      background: linear-gradient(180deg, #fffaf1 0%, var(--pill) 52%, #e7dece 100%);
      color: var(--ink);
      font-weight: 800;
      font-size: 30px;
      letter-spacing: 0.03em;
      line-height: 1;
      border: 1.5px solid rgba(255, 190, 70, 0.9);
      box-shadow:
        0 0 0 1px rgba(255, 130, 25, 0.4),
        0 0 20px rgba(255, 150, 40, 0.55),
        0 0 40px rgba(255, 90, 10, 0.22),
        inset 0 1px 0 rgba(255, 255, 255, 0.7);
      user-select: none;
      pointer-events: none;
    }
    .label {
      position: absolute;
      top: 18px;
      left: 20px;
      font-size: 12px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #6f8572;
      z-index: 3;
    }
  </style>
</head>
<body>
  <div class="label">Realistic fire · steady anchored tongues</div>
  <div class="stage">
    <canvas id="fire"></canvas>
    <div class="pill" id="pill">Runs!</div>
  </div>
  <script>
    const canvas = document.getElementById("fire");
    const pillEl = document.getElementById("pill");
    const ctx = canvas.getContext("2d", { alpha: true });
    const DPR = Math.min(window.devicePixelRatio || 1, 2);

    let W = 0, H = 0;
    let pill = { x: 0, y: 0, w: 0, h: 0 };

    function resize() {
      W = window.innerWidth;
      H = window.innerHeight;
      canvas.width = Math.floor(W * DPR);
      canvas.height = Math.floor(H * DPR);
      ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
      syncPill();
    }

    function syncPill() {
      const r = pillEl.getBoundingClientRect();
      pill = {
        x: r.left + r.width / 2,
        y: r.top + r.height / 2,
        w: r.width,
        h: r.height,
      };
    }

    function rimSample() {
      const hw = pill.w / 2;
      const hh = pill.h / 2;
      const flat = Math.max(0, hw - hh);
      const roll = Math.random();
      if (roll < 0.74) {
        return {
          x: pill.x - flat + Math.random() * flat * 2,
          y: pill.y - hh + (Math.random() - 0.15) * 2,
          zone: "top",
        };
      }
      if (roll < 0.84) {
        const a = Math.PI * 0.7 + Math.random() * Math.PI * 0.6;
        return {
          x: pill.x - flat + Math.cos(a) * hh,
          y: pill.y + Math.sin(a) * hh * 0.7,
          zone: "left",
        };
      }
      if (roll < 0.94) {
        const a = -Math.PI * 0.3 + Math.random() * Math.PI * 0.6;
        return {
          x: pill.x + flat + Math.cos(a) * hh,
          y: pill.y + Math.sin(a) * hh * 0.7,
          zone: "right",
        };
      }
      return {
        x: pill.x - flat + Math.random() * flat * 2,
        y: pill.y + hh,
        zone: "bottom",
      };
    }

    const MAX_P = 28;
    const MAX_E = 18;
    const particles = [];
    const embers = [];

    function makeParticle(front) {
      const s = rimSample();
      const top = s.zone === "top";
      const bottom = s.zone === "bottom";
      const height = top
        ? 56 + Math.random() * 40
        : bottom
          ? 16 + Math.random() * 10
          : 30 + Math.random() * 18;
      const width = top ? 11 + Math.random() * 8 : 7 + Math.random() * 5;
      const life = 1.8 + Math.random() * 1.4;
      return {
        originX: s.x,
        originY: s.y,
        x: s.x,
        y: s.y,
        life,
        age: Math.random() * life * 0.5,
        width,
        height,
        heat: top ? 0.85 + Math.random() * 0.15 : 0.55 + Math.random() * 0.3,
        seed: Math.random() * Math.PI * 2,
        front: !!front,
        swayAmp: 2.5 + Math.random() * 3,
        swayFreq: 2.4 + Math.random() * 0.5,
        flickerFreq: 2.6 + Math.random() * 0.5,
        lean: (Math.random() - 0.5) * 0.18,
        phase: Math.random() * Math.PI * 2,
      };
    }

    function makeEmber() {
      const s = rimSample();
      return {
        originX: s.x,
        originY: s.y,
        x: s.x,
        y: s.y,
        rise: -(64 + Math.random() * 12),
        life: 0.7 + Math.random() * 0.25,
        age: 0,
        size: 1.4 + Math.random() * 1.6,
        phase: Math.random() * Math.PI * 2,
        swayAmp: 7 + Math.random() * 7,
        swayFreq: 1.8 + Math.random() * 0.4,
      };
    }

    function flameTonguePath(w, h) {
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.bezierCurveTo(-w * 0.9, -h * 0.1, -w * 0.55, -h * 0.45, -w * 0.16, -h * 0.8);
      ctx.quadraticCurveTo(0, -h * 1.04, 0, -h);
      ctx.quadraticCurveTo(0, -h * 1.04, w * 0.16, -h * 0.8);
      ctx.bezierCurveTo(w * 0.55, -h * 0.45, w * 0.9, -h * 0.1, 0, 0);
      ctx.closePath();
    }

    function tongueHeightScale(p, time) {
      const t = Math.min(1, p.age / p.life);
      const birth = t < 0.12 ? t / 0.12 : 1;
      const death = t > 0.82 ? 1 - (t - 0.82) / 0.18 : 1;
      const flicker = 0.9 + 0.1 * Math.sin(time * p.flickerFreq + p.phase * 1.3);
      return birth * death * flicker;
    }

    function drawParticle(p, time) {
      const t = Math.min(1, p.age / p.life);
      if (t >= 1) return;
      const hScale = tongueHeightScale(p, time);
      const a = hScale * (0.62 + p.heat * 0.35);
      if (a < 0.03) return;
      const h = p.height * hScale;
      const w = p.width * (1.02 - (1 - hScale) * 0.2);
      if (h < 2) return;

      ctx.save();
      ctx.translate(p.x, p.originY);
      ctx.rotate(p.lean + Math.sin(time * p.swayFreq + p.phase) * 0.05);
      ctx.globalAlpha = a;

      ctx.save();
      ctx.globalCompositeOperation = "lighter";
      ctx.globalAlpha = a * 0.28;
      ctx.scale(1.25, 1.05);
      ctx.fillStyle = "rgba(255, 85, 8, 0.45)";
      flameTonguePath(w, h);
      ctx.fill();
      ctx.restore();

      const grad = ctx.createLinearGradient(0, 0, 0, -h);
      grad.addColorStop(0, `rgba(255, 248, 220, ${0.98 * p.heat})`);
      grad.addColorStop(0.16, "rgba(255, 215, 70, 0.96)");
      grad.addColorStop(0.4, "rgba(255, 140, 22, 0.9)");
      grad.addColorStop(0.7, "rgba(235, 60, 8, 0.5)");
      grad.addColorStop(1, "rgba(90, 15, 0, 0)");
      ctx.globalCompositeOperation = "source-over";
      ctx.fillStyle = grad;
      flameTonguePath(w, h);
      ctx.fill();

      const coreH = h * 0.38;
      const coreW = w * 0.42;
      const core = ctx.createLinearGradient(0, 0, 0, -coreH);
      core.addColorStop(0, "rgba(255,255,248,0.95)");
      core.addColorStop(0.45, "rgba(255,225,95,0.75)");
      core.addColorStop(1, "rgba(255,140,30,0)");
      ctx.globalAlpha = a * 0.9;
      ctx.fillStyle = core;
      flameTonguePath(coreW, coreH);
      ctx.fill();
      ctx.restore();
    }

    function drawEmber(e) {
      const t = e.age / e.life;
      if (t >= 1) return;
      const tw = 0.7 + 0.3 * Math.sin(e.phase + e.age * 9);
      const a = (1 - t) * tw;
      if (a < 0.02) return;
      const s = e.size * (1.05 - t * 0.25);
      ctx.save();
      ctx.globalCompositeOperation = "lighter";
      ctx.globalAlpha = a;
      const g = ctx.createRadialGradient(e.x, e.y, 0, e.x, e.y, s * 2.2);
      g.addColorStop(0, "rgba(255,240,170,1)");
      g.addColorStop(0.45, "rgba(255,160,40,0.75)");
      g.addColorStop(1, "rgba(255,60,0,0)");
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(e.x, e.y, s * 2.2, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    function drawBloom() {
      ctx.save();
      ctx.globalCompositeOperation = "lighter";
      const g = ctx.createRadialGradient(
        pill.x, pill.y - pill.h * 0.1, pill.h * 0.15,
        pill.x, pill.y - pill.h * 0.1, pill.w * 0.5
      );
      g.addColorStop(0, "rgba(255,175,55,0.2)");
      g.addColorStop(0.55, "rgba(255,95,18,0.07)");
      g.addColorStop(1, "rgba(0,0,0,0)");
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.ellipse(pill.x, pill.y - pill.h * 0.05, pill.w * 0.55, pill.h * 0.75, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    function update(dt, time) {
      while (particles.length < MAX_P) {
        particles.push(makeParticle(Math.random() < 0.3));
      }
      if (embers.length < MAX_E && Math.random() < 0.2) {
        embers.push(makeEmber());
      }

      for (let i = 0; i < particles.length; i++) {
        const p = particles[i];
        p.age += dt;
        if (p.age >= p.life) {
          particles[i] = makeParticle(p.front);
          continue;
        }
        p.x = p.originX + Math.sin(time * p.swayFreq + p.phase) * p.swayAmp;
        p.y = p.originY;
      }

      for (let i = embers.length - 1; i >= 0; i--) {
        const e = embers[i];
        e.age += dt;
        if (e.age >= e.life) {
          embers.splice(i, 1);
          continue;
        }
        const t = e.age / e.life;
        e.y = e.originY + e.rise * e.age;
        e.x =
          e.originX +
          Math.sin(time * e.swayFreq + e.phase) * e.swayAmp * (0.35 + t * 0.75);
      }
    }

    function roundRectPath(c, x, y, w, h, r) {
      c.moveTo(x + r, y);
      c.arcTo(x + w, y, x + w, y + h, r);
      c.arcTo(x + w, y + h, x, y + h, r);
      c.arcTo(x, y + h, x, y, r);
      c.arcTo(x, y, x + w, y, r);
      c.closePath();
    }

    let last = performance.now();
    function frame(now) {
      const dt = Math.min(0.033, (now - last) / 1000);
      last = now;
      const time = now / 1000;

      syncPill();
      update(dt, time);

      ctx.clearRect(0, 0, W, H);
      drawBloom();

      for (const p of particles) {
        if (!p.front) drawParticle(p, time);
      }
      for (const e of embers) drawEmber(e);

      ctx.save();
      ctx.beginPath();
      ctx.rect(0, 0, W, H);
      const insetX = pill.w / 2 - 8;
      const insetY = pill.h / 2 - 5;
      roundRectPath(ctx, pill.x - insetX, pill.y - insetY, insetX * 2, insetY * 2, insetY);
      ctx.clip("evenodd");
      for (const p of particles) {
        if (p.front) drawParticle(p, time);
      }
      ctx.restore();

      requestAnimationFrame(frame);
    }

    window.addEventListener("resize", resize);
    resize();
    for (let i = 0; i < MAX_P; i++) particles.push(makeParticle(Math.random() < 0.3));
    for (let i = 0; i < 10; i++) embers.push(makeEmber());
    requestAnimationFrame(frame);
  </script>
</body>
</html>
