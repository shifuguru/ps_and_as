<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Runs! pill — realistic fire</title>
  <style>
    :root {
      --bg0: #040606;
      --pill: #f3eee3;
      --ink: #1a120c;
    }
    * { box-sizing: border-box; margin: 0; }
    html, body {
      height: 100%;
      background:
        radial-gradient(ellipse 50% 40% at 50% 54%, rgba(255, 110, 20, 0.1), transparent 60%),
        radial-gradient(ellipse 90% 80% at 50% 50%, #0c1411 0%, var(--bg0) 72%);
      color: #cfc8bc;
      font-family: "Segoe UI", "Helvetica Neue", sans-serif;
      overflow: hidden;
    }
    .stage {
      position: relative;
      width: 100%;
      height: 100%;
      display: grid;
      place-items: center;
    }
    canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }
    .pill {
      position: relative;
      z-index: 2;
      padding: 15px 40px;
      border-radius: 999px;
      background: linear-gradient(180deg, #fffaf1 0%, var(--pill) 52%, #e7dece 100%);
      color: var(--ink);
      font-weight: 800;
      font-size: 30px;
      letter-spacing: 0.03em;
      line-height: 1;
      border: 1.5px solid rgba(255, 190, 70, 0.9);
      box-shadow:
        0 0 0 1px rgba(255, 130, 25, 0.4),
        0 0 20px rgba(255, 150, 40, 0.55),
        0 0 40px rgba(255, 90, 10, 0.22),
        inset 0 1px 0 rgba(255, 255, 255, 0.7);
      user-select: none;
      pointer-events: none;
    }
    .label {
      position: absolute;
      top: 18px;
      left: 20px;
      font-size: 12px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #6f8572;
      z-index: 3;
    }
  </style>
</head>
<body>
  <div class="label">Realistic fire · even columns across width</div>
  <div class="stage">
    <canvas id="fire"></canvas>
    <div class="pill" id="pill">Runs!</div>
  </div>
  <script>
    /**
     * Step 1 refinement: even flame coverage across the pill width.
     * - Uniform emitter columns (no center beam)
     * - Narrow rising particle streams = identifiable tongues
     * - Tight rim bloom instead of tall aurora curtain
     * - Near-constant rise speed
     */
    const canvas = document.getElementById("fire");
    const pillEl = document.getElementById("pill");
    const ctx = canvas.getContext("2d", { alpha: true });
    const DPR = Math.min(window.devicePixelRatio || 1, 2);

    let W = 0, H = 0;
    let pill = { x: 0, y: 0, w: 0, h: 0 };
    const COLUMNS = 16;

    function resize() {
      W = window.innerWidth;
      H = window.innerHeight;
      canvas.width = Math.floor(W * DPR);
      canvas.height = Math.floor(H * DPR);
      ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
      syncPill();
    }

    function syncPill() {
      const r = pillEl.getBoundingClientRect();
      pill = {
        x: r.left + r.width / 2,
        y: r.top + r.height / 2,
        w: r.width,
        h: r.height,
      };
    }

    function topSpan() {
      const hw = pill.w / 2;
      const hh = pill.h / 2;
      return {
        left: pill.x - hw + hh * 0.15,
        right: pill.x + hw - hh * 0.15,
        y: pill.y - hh,
      };
    }

    function sampleEmitter() {
      const roll = Math.random();
      const span = topSpan();
      const hw = pill.w / 2;
      const hh = pill.h / 2;
      const flat = Math.max(0, hw - hh);

      if (roll < 0.78) {
        const column = Math.floor(Math.random() * COLUMNS);
        const t = column / (COLUMNS - 1);
        const x = span.left + (span.right - span.left) * t;
        const lane = (span.right - span.left) / COLUMNS;
        return {
          x: x + (Math.random() - 0.5) * lane * 0.35,
          y: span.y + (Math.random() - 0.2) * 2,
          zone: "top",
        };
      }
      if (roll < 0.87) {
        const a = Math.PI * 0.7 + Math.random() * Math.PI * 0.55;
        return {
          x: pill.x - flat + Math.cos(a) * hh,
          y: pill.y + Math.sin(a) * hh * 0.85,
          zone: "left",
        };
      }
      if (roll < 0.96) {
        const a = -Math.PI * 0.25 + Math.random() * Math.PI * 0.55;
        return {
          x: pill.x + flat + Math.cos(a) * hh,
          y: pill.y + Math.sin(a) * hh * 0.85,
          zone: "right",
        };
      }
      return {
        x: span.left + (span.right - span.left) * Math.random(),
        y: pill.y + hh,
        zone: "bottom",
      };
    }

    const MAX_P = COLUMNS * 12;
    const MAX_E = 24;
    const particles = [];
    const embers = [];

    function makeParticle(front) {
      const s = sampleEmitter();
      const top = s.zone === "top";
      const bottom = s.zone === "bottom";
      const rise = top
        ? -(85 + Math.random() * 18)
        : bottom
          ? -(26 + Math.random() * 8)
          : -(48 + Math.random() * 12);
      const size = top ? 10 + Math.random() * 9 : 7 + Math.random() * 6;
      const stretch = top ? 1.85 + Math.random() * 0.75 : 1.2 + Math.random() * 0.35;
      const travel = (top ? 70 : 30) * (0.9 + Math.random() * 0.2);
      const life = Math.max(0.3, travel / Math.abs(rise));
      return {
        x: s.x,
        y: s.y,
        anchorX: s.x,
        vx: 0,
        rise,
        life,
        age: Math.random() * life * 0.55,
        size,
        heat: top ? 0.82 + Math.random() * 0.18 : 0.55 + Math.random() * 0.3,
        seed: Math.random() * 1000,
        front: !!front,
        stretch,
      };
    }

    function makeEmber() {
      const s = sampleEmitter();
      return {
        x: s.x,
        y: s.y,
        anchorX: s.x,
        rise: -(62 + Math.random() * 14),
        life: 0.6 + Math.random() * 0.35,
        age: 0,
        size: 1.2 + Math.random() * 1.8,
        phase: Math.random() * Math.PI * 2,
      };
    }

    function drawSoftBlob(x, y, rx, ry, stops) {
      const g = ctx.createRadialGradient(x, y, 0, x, y, Math.max(rx, ry));
      for (const [o, c] of stops) g.addColorStop(o, c);
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2);
      ctx.fill();
    }

    function drawParticle(p) {
      const t = Math.min(1, p.age / p.life);
      if (t >= 1) return;
      const grow = t < 0.12 ? t / 0.12 : 1;
      const fade = t > 0.55 ? 1 - (t - 0.55) / 0.45 : 1;
      const a = grow * fade * (0.3 + p.heat * 0.42);
      if (a < 0.02) return;

      const base = p.size * (0.85 + (1 - t) * 0.25);
      const rx = base * 0.42;
      const ry = base * p.stretch * (1.05 + t * 0.35);

      ctx.save();
      ctx.globalCompositeOperation = "lighter";
      ctx.globalAlpha = a;
      drawSoftBlob(p.x, p.y, rx, ry, [
        [0, `rgba(255,${Math.floor(210 * p.heat)},55,1)`],
        [0.3, `rgba(255,${Math.floor(120 + 35 * p.heat)},16,0.8)`],
        [0.65, "rgba(255,60,5,0.32)"],
        [1, "rgba(40,0,0,0)"],
      ]);
      if (t < 0.4) {
        const k = 1 - t / 0.4;
        ctx.globalAlpha = a * 0.85 * k;
        drawSoftBlob(p.x, p.y + ry * 0.15, rx * 0.45, ry * 0.4, [
          [0, "rgba(255,255,240,1)"],
          [0.45, `rgba(255,230,${Math.floor(130 * p.heat)},0.85)`],
          [1, "rgba(255,140,20,0)"],
        ]);
      }
      ctx.restore();
    }

    function drawEmber(e) {
      const t = e.age / e.life;
      if (t >= 1) return;
      const tw = 0.6 + 0.4 * Math.sin(e.phase + e.age * 12);
      const a = (1 - t) * tw;
      if (a < 0.02) return;
      const s = e.size * (1.05 - t * 0.3);
      ctx.save();
      ctx.globalCompositeOperation = "lighter";
      ctx.globalAlpha = a;
      drawSoftBlob(e.x, e.y, s * 2.2, s * 2.2, [
        [0, "rgba(255,245,180,1)"],
        [0.4, "rgba(255,165,45,0.75)"],
        [1, "rgba(255,60,0,0)"],
      ]);
      ctx.restore();
    }

    function drawBloom() {
      const span = topSpan();
      ctx.save();
      ctx.globalCompositeOperation = "lighter";

      // Even horizontal rim warmth — no tall center curtain.
      const g = ctx.createLinearGradient(span.left, span.y, span.right, span.y);
      g.addColorStop(0, "rgba(255,140,30,0)");
      g.addColorStop(0.08, "rgba(255,160,40,0.16)");
      g.addColorStop(0.5, "rgba(255,170,50,0.18)");
      g.addColorStop(0.92, "rgba(255,160,40,0.16)");
      g.addColorStop(1, "rgba(255,140,30,0)");
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.ellipse(
        pill.x,
        span.y + 2,
        (span.right - span.left) * 0.52,
        pill.h * 0.55,
        0, 0, Math.PI * 2
      );
      ctx.fill();

      const rim = ctx.createRadialGradient(
        pill.x, pill.y, pill.h * 0.35,
        pill.x, pill.y, pill.w * 0.55
      );
      rim.addColorStop(0, "rgba(255,190,70,0.1)");
      rim.addColorStop(0.65, "rgba(255,120,30,0.05)");
      rim.addColorStop(1, "rgba(0,0,0,0)");
      ctx.fillStyle = rim;
      ctx.beginPath();
      ctx.ellipse(pill.x, pill.y, pill.w * 0.56, pill.h * 0.7, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    function update(dt, time) {
      while (particles.length < MAX_P) {
        particles.push(makeParticle(Math.random() < 0.3));
      }
      if (embers.length < MAX_E && Math.random() < 0.28) {
        embers.push(makeEmber());
      }

      for (let i = 0; i < particles.length; i++) {
        const p = particles[i];
        p.age += dt;
        if (p.age >= p.life) {
          particles[i] = makeParticle(p.front);
          continue;
        }
        const t = p.age / p.life;
        p.y += p.rise * dt;
        const wobble =
          Math.sin(time * 3.2 + p.seed) * 7 +
          Math.sin(time * 5.1 + p.seed * 1.3) * 3.5;
        const pull = (p.anchorX + wobble * (0.35 + t * 0.65) - p.x) * 8;
        p.vx += pull * dt;
        p.vx *= 1 - 4 * dt;
        p.x += p.vx * dt;
        const laneSlack = 12;
        if (p.x < p.anchorX - laneSlack) p.x = p.anchorX - laneSlack;
        if (p.x > p.anchorX + laneSlack) p.x = p.anchorX + laneSlack;
      }

      for (let i = embers.length - 1; i >= 0; i--) {
        const e = embers[i];
        e.age += dt;
        if (e.age >= e.life) {
          embers.splice(i, 1);
          continue;
        }
        const t = e.age / e.life;
        e.y += e.rise * dt;
        e.x = e.anchorX + Math.sin(time * 2.2 + e.phase) * 10 * (0.3 + t * 0.7);
      }
    }

    function roundRectPath(c, x, y, w, h, r) {
      c.moveTo(x + r, y);
      c.arcTo(x + w, y, x + w, y + h, r);
      c.arcTo(x + w, y + h, x, y + h, r);
      c.arcTo(x, y + h, x, y, r);
      c.arcTo(x, y, x + w, y, r);
      c.closePath();
    }

    let last = performance.now();
    function frame(now) {
      const dt = Math.min(0.033, (now - last) / 1000);
      last = now;
      const time = now / 1000;

      syncPill();
      update(dt, time);

      ctx.clearRect(0, 0, W, H);
      drawBloom();

      for (const p of particles) {
        if (!p.front) drawParticle(p);
      }
      for (const e of embers) drawEmber(e);

      ctx.save();
      ctx.beginPath();
      ctx.rect(0, 0, W, H);
      const insetX = pill.w / 2 - 8;
      const insetY = pill.h / 2 - 5;
      roundRectPath(ctx, pill.x - insetX, pill.y - insetY, insetX * 2, insetY * 2, insetY);
      ctx.clip("evenodd");
      for (const p of particles) {
        if (p.front) drawParticle(p);
      }
      ctx.restore();

      requestAnimationFrame(frame);
    }

    window.addEventListener("resize", resize);
    resize();
    for (let i = 0; i < MAX_P; i++) particles.push(makeParticle(Math.random() < 0.3));
    for (let i = 0; i < 12; i++) embers.push(makeEmber());
    requestAnimationFrame(frame);
  </script>
</body>
</html>
